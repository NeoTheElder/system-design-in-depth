      stem:`<p>A user has opted out of SMS and has set quiet hours from 22:00 to 08:00. The platform processes five notifications for this user, at these local times:</p><p>(i) 23:10, standard, email: a promotion.<br>(ii) 23:10, high priority, email: a login code.<br>(iii) 23:15, high priority, push: a fraud alert.<br>(iv) 07:30, standard, push: a daily digest.<br>(v) 14:00, standard, SMS: a delivery update.</p><p>How many of the five are recorded as SUPPRESSED?</p>`,
      why:`<ul><li>(i) Suppressed: standard, and inside quiet hours.</li><li>(ii) Sent: quiet hours do not apply to high-priority notifications, and the user has not opted out of email.</li><li>(iii) Sent, for the same reason.</li><li>(iv) Suppressed: 07:30 is still inside the quiet window.</li><li>(v) Suppressed: the user has opted out of SMS, whatever the hour.</li></ul><p>Answer: <b>3</b>.</p><p>Each of the three is written down as SUPPRESSED with its reason, and is not dropped silently. That record is what later answers the question “why did this user not get this notification?”.</p>` }
    ]},

  { title:'Passage VII: the hardened design', fig:'nfinal',
    text:`<p>The hardened design, shown in the figure, takes delivery off the request path. Accepting a notification becomes a single publish to a durable queue. Workers pull from the queue, check preferences, call the provider, and record SENT, FAILED or SUPPRESSED.</p><p>A message that a worker has pulled is hidden from other workers for a visibility timeout, and is deleted only when the worker has finished. If the worker dies first, the message reappears and another worker takes it.</p><p>There are two queues, each with its own workers: one for high-priority notifications and one for standard ones. The ceiling is set by the providers, not by the workers. Together the providers accept about 5,000 sends a second, and a token bucket in Redis keeps the platform under that rate. Redis also holds a deduplication cache.</p><p>Delivery is at-least-once with best-effort deduplication. The team would rather send a notification twice by accident than never send it.</p>`,
    items:[
    { id:'q50', type:'multi',
      stem:`<p>The breakdown calls notification delivery a multi-step process (accept, enqueue, deliver, record), and yet it does not reach for a workflow engine. Which statements are consistent with that choice?</p>`,
      opts:[
        `Each step can still fail on its own, so durable progress, retries and duplicates have to be dealt with anyway, here with a queue, a visibility timeout and deduplication.`,
        `A workflow engine would hide the parts of the problem that an interviewer most wants to see worked through.`,
        `These are high-frequency, low-value operations, where an engine’s round trips and history writes for every step are hard to justify.`,
        `A workflow engine has no means of retrying a failed provider call.`
      ], ans:[0,1,2],
      why:`<ul><li>(A) Correct. Leaving the engine out does not make the workflow problems go away. The design solves the same problems by hand.</li><li>(B) Correct. This is the breakdown’s stated reason: most interviewers will wave the engine away because it obscures the interesting parts.</li><li>(C) Correct. This is the pattern article’s own test for when not to use a workflow. A notification is one cheap send, and there are thousands of them a second.</li><li>(D) Wrong. Retrying an Activity is the most basic thing an engine does. The objection is about cost and fit, not capability.</li></ul>` },

    { id:'q51', type:'single',
      stem:`<p>A candidate proposes this for accepting a notification: write the Notification row to the database, then publish a message to the queue, then reply to the caller. Which assessment matches the breakdown?</p>`,
      opts:[
        `It is sound. The database row makes the notification durable, and the queue message is only an optimisation.`,
        `It is a dual write, and the only correct repair is a two-phase commit between the database and the queue.`,
        `It is a dual write. A crash between the two steps leaves a row that no message stands for, so the notification is never delivered. An outbox would repair that, but accepting a notification needs only one durable publish, so the simpler answer is to make the publish itself the acceptance.`,
        `It fails because a queue cannot hold a notification durably, so the database has to remain the record of acceptance.`
      ], ans:[2],
      why:`<p>Two separate writes with a crash window between them is the dual write problem. Here the damage is a row with no message: the caller was told “accepted”, and no worker will ever see the notification. It is the PENDING-row failure of the first design in a new place.</p><p>The outbox pattern derives the queue from committed rows. It is the right tool when database state and a message must be produced together. Accepting a notification is not that case, because it is one publish and nothing else. So the design publishes to the durable queue and treats that as acceptance, and the worker records the outcome later.</p><p>(B) reaches for the heaviest tool available, and (D) is simply untrue of a durable queue.</p>` },

    { id:'q52', type:'num', ans:250,
      stem:`<p>To protect the high-priority tier, 1,000 of the providers’ 5,000 sends a second are set aside for it, whether or not they are used. A campaign of 1,000,000 standard notifications is enqueued at t = 0, and there are enough standard workers to use all of the standard share.</p><p>How many seconds does the campaign take to drain?</p>`,
      why:`<p>The standard tier may use 5,000 − 1,000 = 4,000 sends a second.</p><p>1,000,000 ÷ 4,000 = <b>250</b> seconds, against 200 seconds with the whole budget.</p><p>That is the price of isolation, and a promotion can afford it. Two things follow. Adding standard workers does not shorten the 250 seconds, because the ceiling is at the providers. And separate queues alone do not isolate the tiers: if both sets of workers drew on one undivided budget, a campaign could still take every token. The budget has to be divided as well as the queue.</p>` },

    { id:'q53', type:'num', ans:10,
      stem:`<p>The SMS provider browns out. Calls that normally return in 0.2 s now hang until a 30 s timeout. The SMS path has 300 workers, each making one call at a time, with no circuit breaker and no bulkhead.</p><p>How many SMS calls a second do the 300 workers get through while the brownout lasts?</p>`,
      why:`<p>Each call holds its worker for 30 s, so 300 workers get through 300 ÷ 30 = <b>10</b> calls a second, and those calls time out. In normal conditions the same workers handle 300 ÷ 0.2 = 1,500 calls a second.</p><p>The workers do not know that the provider is slow, so they keep calling, and the whole pool ends up waiting on a service that is mostly down. This is the case for the three defences in the next question.</p>` },

    { id:'q54', type:'single', tag:'Match the lists',
      stem:`<p>Match each mechanism with what it does.</p>`,
      lists:{ I:[['P','Circuit breaker'],['Q','Bulkhead'],['R','Provider router'],['S','Token bucket']],
              II:[['1','Caps how many calls to one provider can be in flight at once, so that a slow provider cannot occupy every worker'],['2','Tracks failures and timeouts for each provider and, past a threshold, makes calls fail at once instead of waiting out the timeout'],['3','Gives a channel a primary provider and a backup'],['4','Holds the platform’s send rate under what the providers accept'],['5','Hides a pulled message from other workers until it is deleted or a timer runs out']] },
      opts:[ `P → 2, Q → 1, R → 3, S → 4`, `P → 1, Q → 2, R → 3, S → 4`, `P → 2, Q → 5, R → 3, S → 1`, `P → 2, Q → 1, R → 4, S → 3` ], ans:[0],
      why:`<p>A circuit breaker stops calling a provider that is failing (P → 2). A bulkhead works like a semaphore on calls to one provider (Q → 1). A provider router switches to a backup where the channel has one (R → 3). The token bucket is the rate limit that keeps the platform under the providers’ ceiling (S → 4).</p><p>Entry 5 describes the queue’s visibility timeout. The two most often confused are the first two: the breaker reacts to failure it has observed, while the bulkhead limits exposure whether or not anything has failed yet.</p>` },

    { id:'q55', type:'multi',
      stem:`<p>Which statements about duplicates in this design are correct?</p>`,
      opts:[
        `A worker that calls the provider and dies before deleting its message causes a second send once the visibility timeout runs out, unless something recognises the notification as already sent.`,
        `An upstream service that times out and POSTs again creates a duplicate, unless the request carries an idempotency key.`,
        `A cron job that crashes half-way through a fan-out and runs again re-enqueues recipients that it had already handled.`,
        `With deduplication at the worker, the design achieves exactly-once delivery to the user’s device.`
      ], ans:[0,1,2],
      why:`<ul><li>(A), (B) and (C) Correct. These are the three places where duplicates get in: at the worker, at the API, and at fan-out. The breakdown’s advice is to deduplicate at each point where duplicates can enter, and to be able to point at each one on the diagram.</li><li>(D) Wrong. Exactly-once stops at the provider boundary. Beyond it, the platform cannot see whether a send that timed out actually reached the phone. The honest description is at-least-once with deduplication, and the requirement itself says “best-effort”.</li></ul>` },

    { id:'q56', type:'single',
      stem:`<p>A worker handles each message in three steps. (1) Claim the notification’s key in the deduplication cache with set-if-absent. If the key was already there, delete the message and stop. (2) Call the provider. (3) Delete the message.</p><p>A worker crashes between steps 1 and 2. What follows?</p>`,
      opts:[
        `The message reappears and the next worker sends the notification. The key only prevents a third send.`,
        `The notification is sent twice, which is the accepted cost of at-least-once delivery.`,
        `Nothing is lost, because the cache entry expires together with the visibility timeout.`,
        `The message reappears, the next worker finds the key and discards the message, and the notification is never sent. Claiming the key before the call has turned at-least-once into at-most-once.`
      ], ans:[3],
      why:`<p>After the crash the key says “handled”, and nothing was sent. When the message reappears, the next worker sees the key, concludes that it is looking at a duplicate, and deletes the message. The notification is gone. That is the one outcome the requirement rules out: twice is tolerable, never is not.</p><p>The order of the two writes decides which way a crash fails. If the key is recorded after the provider call, a crash in between produces a duplicate, which is the acceptable direction. If it is claimed before, a crash produces a loss. If a marker before the call is wanted, it has to mean “in progress”, and a worker that finds it must not treat it as “done”. That is the two-state key of Question 24.</p><p>(C) invents a link that the design does not have. Nothing ties the lifetime of the cache entry to the queue’s timeout.</p>` },

    { id:'q57', type:'multi',
      stem:`<p>Which of these judgement calls fit the requirements in the passage?</p>`,
      opts:[
        `The deduplication cache is unreachable for two minutes, while the token bucket still works. Workers carry on sending without the duplicate check and accept that a few duplicates may go out.`,
        `Failing over to a backup provider is worth its cost for the high-priority tier, and not for standard traffic.`,
        `During a provider brownout, standard notifications that wait in their queue break the at-least-once guarantee.`,
        `While the deduplication cache is unreachable, the high-priority queue is paused, so that no login code can be sent twice.`
      ], ans:[0,1],
      why:`<ul><li>(A) Fits. The breakdown poses this as a question for staff candidates. The requirement answers it: deduplication is best-effort, and a duplicate is preferred to a missed notification, so the check fails open.</li><li>(B) Fits. A login code that arrives late is useless, so paying for a second route is justified. A promotion can wait in its queue until the provider recovers.</li><li>(C) Does not fit. Waiting is not dropping. At-least-once is about whether the notification is eventually sent, and only the high-priority tier carries a deadline.</li><li>(D) Does not fit. It gives up the 5-second promise to protect a guarantee that was only ever best-effort. A second login code is a nuisance. No login code is an outage.</li></ul>` }
    ]}
  ]}
];

var NS='http://www.w3.org/2000/svg', seed=11;
var COL={ink:'var(--d-ink)',mute:'var(--d-mute)',acc:'var(--d-acc)'};
var FILL={blue:'var(--f-blue)',green:'var(--f-green)',yellow:'var(--f-yellow)',pink:'var(--f-pink)',violet:'var(--f-violet)',gray:'var(--f-gray)'};
function S(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function hasRough(){return !!(window.rough&&window.rough.svg);}

function board(host,w,h,label){
  var svg=S('svg',{viewBox:'0 0 '+w+' '+h,role:'img','aria-label':label});
  var gs=S('g',{},svg), gt=S('g',{},svg);
  var rc=hasRough()?window.rough.svg(svg):null;
  if(!rc) gs.setAttribute('filter','url(#wob)');
  host.appendChild(svg);

  function draw(d,o){
    o=o||{};
    var stroke=COL[o.c||'ink'], sw=o.sw||1.5;
    if(rc){
      var opt={roughness:o.rough==null?1:o.rough,bowing:1,strokeWidth:sw,stroke:stroke,seed:seed++};
      if(o.fill){opt.fill=FILL[o.fill];opt.fillStyle='solid';}
      if(o.dash){opt.strokeLineDash=[6,5];}
      var node=rc.path(d,opt);
      var ps=node.querySelectorAll('path');
      for(var i=0;i<ps.length;i++){
        var p=ps[i];
        ['stroke','fill'].forEach(function(a){var v=p.getAttribute(a);if(v&&v.indexOf('var(')===0)p.style[a]=v;});
        p.setAttribute('stroke-linecap','round');
      }
      gs.appendChild(node);
    } else {
      var el=S('path',{d:d,'stroke-width':sw,'stroke-linecap':'round','stroke-linejoin':'round',fill:'none'},gs);
      el.style.stroke=stroke;
      if(o.fill) el.style.fill=FILL[o.fill];
      if(o.dash) el.setAttribute('stroke-dasharray','6 5');
    }
  }
  function rr(x,y,w,h,r){return 'M'+(x+r)+' '+y+'H'+(x+w-r)+'Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+'V'+(y+h-r)+'Q'+(x+w)+' '+(y+h)+' '+(x+w-r)+' '+(y+h)+'H'+(x+r)+'Q'+x+' '+(y+h)+' '+x+' '+(y+h-r)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'Z';}
  function text(x,y,str,o){
    o=o||{};
    var size=o.size||15, lines=String(str).split('\n'), lh=size*1.22;
    var t=S('text',{'text-anchor':o.anchor||'middle','font-size':size},gt);
    t.style.fill=COL[o.c||'ink'];
    if(o.bold) t.setAttribute('font-weight','700');
    var y0=y-(lines.length-1)*lh/2+size*0.34;
    lines.forEach(function(ln,i){var ts=S('tspan',{x:x,y:(y0+i*lh).toFixed(1)},t);ts.textContent=ln;});
  }
  function box(x,y,w,h,label,o){
    o=o||{};
    draw(rr(x,y,w,h,o.r||9),{fill:o.fill,dash:o.dash,c:o.c});
    if(label) text(x+w/2,y+h/2,label,{size:o.size,c:o.tc,bold:o.bold});
    return {x:x,y:y,w:w,h:h,cx:x+w/2,cy:y+h/2,l:[x,y+h/2],r:[x+w,y+h/2],t:[x+w/2,y],b:[x+w/2,y+h]};
  }
  function line(a,b,o){draw('M'+a[0]+' '+a[1]+'L'+b[0]+' '+b[1],o);}
  function arrow(a,b,o){
    o=o||{};
    var pts=[a].concat(o.via||[],[b]);
    draw('M'+pts.map(function(p){return p[0]+' '+p[1];}).join('L'),{c:o.c,dash:o.dash});
    var p=pts[pts.length-2], ang=Math.atan2(b[1]-p[1],b[0]-p[0]), L=11, sp=0.42;
    var h1=[b[0]-L*Math.cos(ang-sp),b[1]-L*Math.sin(ang-sp)], h2=[b[0]-L*Math.cos(ang+sp),b[1]-L*Math.sin(ang+sp)];
    draw('M'+h1[0].toFixed(1)+' '+h1[1].toFixed(1)+'L'+b[0]+' '+b[1]+'L'+h2[0].toFixed(1)+' '+h2[1].toFixed(1),{c:o.c,rough:0.6});
    if(o.label){
      var lp=o.lp||[(a[0]+b[0])/2+(o.lo?o.lo[0]:0),(a[1]+b[1])/2+(o.lo?o.lo[1]:-10)];
      text(lp[0],lp[1],o.label,{size:o.ls||14,c:o.lc||o.c,bold:o.lb});
    }
  }
  function cross(x,y,s){draw('M'+(x-s)+' '+(y-s)+'L'+(x+s)+' '+(y+s),{c:'acc',sw:2.3});draw('M'+(x+s)+' '+(y-s)+'L'+(x-s)+' '+(y+s),{c:'acc',sw:2.3});}
  return {box:box,text:text,arrow:arrow,line:line,cross:cross};
}

function drawFigs(root){
  var hosts=root.querySelectorAll('.fig[data-fig]');
  for(var i=0;i<hosts.length;i++){
    var h=hosts[i], f=FIG[h.getAttribute('data-fig')];

/* ───────────────────────── app ───────────────────────── */

var KEY='msp-jee-paper-v1';
var MARKS={single:{full:3,neg:-1},multi:{full:4,neg:-2},num:{full:4,neg:0}};
var L=['A','B','C','D'];
var TAG={single:'One correct option',multi:'One or more correct options',num:'Whole number'};
var paper=document.getElementById('paper'), omr=document.getElementById('omr');
var QS=[], byId={}, st={};

(function index(){
  var n=0;
  DATA.forEach(function(sec){
    var push=function(q){q.n=++n;q.sec=sec.id;QS.push(q);byId[q.id]=q;};
    if(sec.items) sec.items.forEach(push);
    if(sec.passages) sec.passages.forEach(function(p){p.items.forEach(push);});
  });
})();
var MAX=QS.reduce(function(s,q){return s+MARKS[q.type].full;},0);

function load(){try{var raw=window.localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&typeof o==='object')return o;}}catch(e){}return {};}
function save(){try{window.localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function secOf(q){for(var i=0;i<DATA.length;i++)if(DATA[i].id===q.sec)return DATA[i];}
function secQs(sec){return QS.filter(function(q){return q.sec===sec.id;});}
function secMax(sec){return secQs(sec).reduce(function(s,q){return s+MARKS[q.type].full;},0);}

function qHTML(q,showTag){
  var h='<article class="q" id="'+q.id+'"><div class="q-n">'+q.n+'.<span class="mark" aria-hidden="true"></span></div><div class="q-b">';
  if(showTag) h+='<p class="q-tag">'+(q.tag||TAG[q.type])+'</p>';
  h+='<div class="stem">'+q.stem+'</div>';
  if(q.code) h+='<pre><code>'+esc(q.code)+'</code></pre>';
  if(q.fig) h+='<div class="fig" data-fig="'+q.fig+'"></div>';
  if(q.lists){
    h+='<div class="lists"><div><h4>List I</h4>'+q.lists.I.map(function(r){return '<p>('+r[0]+')&nbsp; '+r[1]+'</p>';}).join('')+'</div><div><h4>List II</h4>'+q.lists.II.map(function(r){return '<p>('+r[0]+')&nbsp; '+r[1]+'</p>';}).join('')+'</div></div>';
  }
  if(q.type==='num'){
    h+='<div class="num"><label for="'+q.id+'-in">Your answer</label><input id="'+q.id+'-in" type="text" inputmode="numeric" autocomplete="off" maxlength="9"></div>';
  } else {
    h+='<fieldset class="opts"><legend class="vh">Options for question '+q.n+'</legend>';
    q.opts.forEach(function(o,i){
      h+='<label class="opt"><input type="'+(q.type==='multi'?'checkbox':'radio')+'" name="'+q.id+'" value="'+i+'"><span class="bub">'+L[i]+'</span><span class="otext">'+o+'</span><span class="flag"></span></label>';
    });
    h+='</fieldset>';
  }
  h+='<div class="acts"><button class="btn" data-act="check" disabled>Check answer</button><button class="btn ghost" data-act="show">Show solution</button></div><div class="sol" hidden></div></div></article>';
  return h;
}

function build(){
  var h='';
  h+='<section class="cover"><h1>Multi-step Processes</h1>'+
     '<p class="sub">A practice paper in the JEE Advanced pattern on sagas, choreography, workflow engines and durable execution.</p>'+
     '<div class="fig" data-fig="'+(window.innerWidth<600?'heroS':'hero')+'"></div>'+
     '<div class="facts"><div><b>'+QS.length+'</b><span>questions</span></div><div><b>'+MAX+'</b><span>maximum marks</span></div><div><b>120</b><span>minutes suggested</span></div></div>'+
     '<ul class="notes">'+
     '<li>Mark your answer, then choose Check answer. The question locks and its solution opens.</li>'+
     '<li>Wrong answers cost marks in most sections. Each section states its own scheme.</li>'+
     '<li>Show solution opens the working without an attempt and scores 0.</li>'+
     '<li>Sections 1 to 5 are set from the Multi-step Processes article. Section 6 applies it to one short scenario each from the Uber, Payment System and Notification System breakdowns. Sections 7 and 8 work through the Payment System and Notification System breakdowns in depth.</li>'+
     '<li>Your answers are kept in this browser until you choose Start over.</li>'+
     '</ul></section>';
  DATA.forEach(function(sec){
    h+='<section class="sec" id="'+sec.id+'"><div class="sec-h"><h2>'+sec.name+' <span>(maximum marks: '+secMax(sec)+')</span></h2></div><ul class="sec-i">'+sec.rules.map(function(r){return '<li>'+r+'</li>';}).join('')+'</ul>';
    if(sec.items) sec.items.forEach(function(q){h+=qHTML(q,false);});
    if(sec.passages) sec.passages.forEach(function(p){
      h+='<div class="passage"><h3>'+p.title+'</h3>'+p.text+(p.fig?'<div class="fig" data-fig="'+p.fig+'"></div>':'')+'</div>';
      p.items.forEach(function(q){h+=qHTML(q,true);});
    });
    h+='</section>';
  });
  h+='<section class="result" id="result"><h2>Marks by section</h2><p id="resultLine"></p><div class="tw"><table><thead><tr><th>Section</th><th class="r">Checked</th><th class="r">Marks</th></tr></thead><tbody id="resultBody"></tbody><tfoot><tr><td>Total</td><td class="r" id="rDone"></td><td class="r" id="rMarks"></td></tr></tfoot></table></div></section>';
  paper.innerHTML=h;

  var o='<h2>Answer sheet</h2><p class="hint">Select a row to go to that question.</p><div class="omr-grid">';
  DATA.forEach(function(sec){
    o+='<div class="omr-sec">'+sec.name+'</div>';
    secQs(sec).forEach(function(q){
      o+='<button class="omr-row" data-q="'+q.id+'" aria-label="Go to question '+q.n+'"><span class="n">'+q.n+'</span>'+
         (q.type==='num'?'<span><span class="numbox"></span></span>':'<span class="bubs"><i></i><i></i><i></i><i></i></span>')+
         '<span class="st"></span></button>';
    });
  });
  o+='</div>';
  omr.innerHTML=o;

  drawFigs(paper);
  QS.forEach(function(q){
    var s=st[q.id]; if(!s) return;
    var el=document.getElementById(q.id);
    if(q.type==='num'){ el.querySelector('.num input').value=s.val||''; }
    else { (s.sel||[]).forEach(function(i){var inp=el.querySelector('input[value="'+i+'"]'); if(inp) inp.checked=true;}); }
    if(s.res) lock(q,el,s); else el.querySelector('[data-act=check]').disabled=!hasAnswer(q,s);
    row(q);
  });
  totals();
}

function hasAnswer(q,s){return q.type==='num'?/\S/.test(s.val||''):(s.sel||[]).length>0;}
function parseNum(v){var t=String(v).trim().replace(/\u2212/g,'-').replace(/,/g,'');if(!/^-?\d+(\.\d+)?$/.test(t))return NaN;return Number(t);}

function grade(q,s){
  var m=MARKS[q.type];
  if(q.type==='num'){ return parseNum(s.val)===q.ans?{res:'right',pts:m.full}:{res:'wrong',pts:0}; }
  var sel=(s.sel||[]).slice().sort(), ans=q.ans.slice().sort();
  var wrongPick=sel.some(function(i){return ans.indexOf(i)<0;});
  if(!wrongPick&&sel.length===ans.length) return {res:'right',pts:m.full};
  if(q.type==='multi'&&!wrongPick&&sel.length>0) return {res:'partial',pts:sel.length};
  return {res:'wrong',pts:m.neg};
}

function ansText(q){return q.type==='num'?String(q.ans):q.ans.map(function(i){return '('+L[i]+')';}).join(', ');}
function ptsText(p){return p>0?'+'+p:(p<0?'\u2212'+Math.abs(p):'0');}

function drawMark(el,txt){
  el.textContent='';
  var svg=S('svg',{viewBox:'0 0 60 44'},el);
  if(hasRough()){
    var n=window.rough.svg(svg).ellipse(30,22,52,34,{stroke:'currentColor',strokeWidth:1.7,roughness:1.5,seed:5+txt.length*3});
    svg.appendChild(n);
  } else { S('ellipse',{cx:30,cy:22,rx:26,ry:17,fill:'none',stroke:'currentColor','stroke-width':1.7},svg); }
  var t=S('text',{x:30,y:29,'text-anchor':'middle'},svg); t.textContent=txt;
}

function lock(q,el,s){
  el.classList.add('locked'); el.setAttribute('data-res',s.res);
  var inputs=el.querySelectorAll('input'); for(var i=0;i<inputs.length;i++) inputs[i].disabled=true;
  if(q.type!=='num'){
    var labels=el.querySelectorAll('.opt');
    for(var j=0;j<labels.length;j++){
      var isAns=q.ans.indexOf(j)>=0, picked=(s.sel||[]).indexOf(j)>=0, flag=labels[j].querySelector('.flag');
      if(isAns){labels[j].classList.add('is-ans');flag.textContent=picked?'Correct, and you chose it':'Correct option';}
      else if(picked){labels[j].classList.add('is-bad');flag.textContent='You chose this';}
    }
  }
  el.querySelector('.acts').hidden=true;
  var word={right:'Correct.',partial:'Partly correct.',wrong:'Incorrect.',shown:'Not attempted.'}[s.res];
  var sol=el.querySelector('.sol');
  sol.setAttribute('data-res',s.res);
  sol.innerHTML='<p class="verdict"><b>'+word+'</b> Answer: '+ansText(q)+'. Marks: '+ptsText(s.pts)+'.</p>'+q.why;
  sol.hidden=false;
  drawMark(el.querySelector('.mark'),ptsText(s.pts));
}

function row(q){
  var r=omr.querySelector('.omr-row[data-q="'+q.id+'"]'); if(!r) return;
  var s=st[q.id]||{};
  if(q.type==='num'){ r.querySelector('.numbox').textContent=s.val||''; }
  else { var b=r.querySelectorAll('.bubs i'); for(var i=0;i<b.length;i++) b[i].className=(s.sel||[]).indexOf(i)>=0?'on':''; }
  if(s.res){ r.setAttribute('data-res',s.res); r.querySelector('.st').textContent={right:'\u2713',partial:'\u00bd',wrong:'\u2717',shown:'\u2013'}[s.res]; }
  else { r.removeAttribute('data-res'); r.querySelector('.st').textContent=''; }
}

function totals(){
  var score=0, done=0, rows='';
  DATA.forEach(function(sec){
    var qs=secQs(sec), d=0, p=0;
    qs.forEach(function(q){var s=st[q.id]; if(s&&s.res){d++;p+=s.pts;}});
    score+=p; done+=d;
    rows+='<tr><td>'+sec.name+'</td><td class="r">'+d+' of '+qs.length+'</td><td class="r">'+ptsText(p).replace('+','')+' / '+secMax(sec)+'</td></tr>';
  });
  document.getElementById('score').textContent=ptsText(score).replace('+','');
  document.getElementById('max').textContent=MAX;
  document.getElementById('done').textContent=done;
  document.getElementById('total').textContent=QS.length;
  document.getElementById('resultBody').innerHTML=rows;
  document.getElementById('rDone').textContent=done+' of '+QS.length;
  document.getElementById('rMarks').textContent=ptsText(score).replace('+','')+' / '+MAX;
  document.getElementById('resultLine').textContent=done===0?'Nothing checked yet. Marks appear here as you check answers.':(done<QS.length?(QS.length-done)+' questions still to check.':'All questions checked.');
}

function read(q,el){
  var s=st[q.id]||(st[q.id]={sel:[],val:'',res:null,pts:0});
  if(s.res) return s;
  if(q.type==='num'){ s.val=el.querySelector('.num input').value.trim(); }
  else { s.sel=[]; var c=el.querySelectorAll('input:checked'); for(var i=0;i<c.length;i++) s.sel.push(Number(c[i].value)); }
  el.querySelector('[data-act=check]').disabled=!hasAnswer(q,s);
  save(); row(q);
  return s;
}

function finish(q,el,shown){
  var s=read(q,el); if(s.res) return;
  if(shown){ s.res='shown'; s.pts=0; }
  else { if(!hasAnswer(q,s)) return; var g=grade(q,s); s.res=g.res; s.pts=g.pts; }
  save(); lock(q,el,s); row(q); totals();
}

function onEdit(e){
  var el=e.target.closest&&e.target.closest('.q'); if(!el||!byId[el.id]) return;
  if(e.target.tagName==='INPUT') read(byId[el.id],el);
}
paper.addEventListener('change',onEdit);
paper.addEventListener('input',onEdit);
paper.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('.num input')){ var el=e.target.closest('.q'); finish(byId[el.id],el,false); }
});
paper.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button[data-act]'); if(!b) return;
  var el=b.closest('.q'); finish(byId[el.id],el,b.getAttribute('data-act')==='show');
});

var toggle=document.getElementById('omrToggle');
function setSheet(open){omr.classList.toggle('open',open);toggle.setAttribute('aria-expanded',open?'true':'false');}
toggle.addEventListener('click',function(){setSheet(!omr.classList.contains('open'));});
omr.addEventListener('click',function(e){
  var r=e.target.closest&&e.target.closest('.omr-row'); if(!r) return;
  setSheet(false);
  var el=document.getElementById(r.getAttribute('data-q'));
  var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({behavior:calm?'auto':'smooth',block:'start'});
});

var reset=document.getElementById('reset'), armed=null;
reset.addEventListener('click',function(){
  if(!armed){
    reset.textContent='Clear all answers?';
    armed=setTimeout(function(){armed=null;reset.textContent='Start over';},4000);
    return;
  }
  clearTimeout(armed); armed=null; reset.textContent='Start over';
  st={}; save(); build(); window.scrollTo(0,0);
});

function barH(){document.documentElement.style.setProperty('--barh',document.getElementById('bar').offsetHeight+'px');}
window.addEventListener('resize',barH);

st=load();
build();
barH();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(barH);}
})();
</script>
</body>
</html>
